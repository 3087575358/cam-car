<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ESP32-CAM 画面控制</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #FFF;
            font-size: 16px;
            margin: 0;
            padding: 12px;
        }

        h2 {
            color: #FFFF00;
            font-size: 18px;
            margin: 8px 0;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 控制面板 */
        .controls {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 6px;
        }

        label {
            font-size: 14px;
            white-space: nowrap;
        }

        select, input[type="range"] {
            background: #363636;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
            background: #ff3034;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #ff494d;
        }

        button:active {
            background: #f21c21;
        }

        button.active {
            background: #30ff34;
        }

        /* 显示区域 */
        .view-area {
            position: relative;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            min-height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #stream {
            max-width: 100%;
            max-height: 80vh;
            display: block;
            border-radius: 4px;
        }

        .hidden {
            display: none !important;
        }

        /* 保存按钮 */
        .save-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 48, 52, 0.9);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 10;
        }

        .save-btn:hover {
            background: rgba(255, 73, 77, 0.95);
        }

        .empty-state {
            color: #666;
            font-size: 18px;
            padding: 40px;
        }

        /* 滑块样式 */
        input[type=range] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: #555;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff3034;
            cursor: pointer;
        }

        .range-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .range-val {
            min-width: 30px;
            text-align: center;
            font-family: monospace;
            color: #ff3034;
        }
    </style>
</head>
<body>
    <div class="main">
        <h2>📷 ESP32-CAM 画面传输控制</h2>
        
        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group">
                <label>分辨率:</label>
                <select id="framesize" class="action">
                    <option value="13">UXGA (1600x1200)</option>
                    <option value="12">SXGA (1280x1024)</option>
                    <option value="11">HD (1280x720)</option>
                    <option value="10">XGA (1024x768)</option>
                    <option value="9">SVGA (800x600)</option>
                    <option value="8" selected>VGA (640x480)</option>
                    <option value="7">HVGA (480x320)</option>
                    <option value="6">CIF (400x296)</option>
                    <option value="5">QVGA (320x240)</option>
                    <option value="4">240x240</option>
                    <option value="3">HQVGA (240x176)</option>
                    <option value="2">QCIF (176x144)</option>
                    <option value="1">QQVGA (160x120)</option>
                    <option value="0">96x96</option>
                </select>
            </div>

            <div class="control-group">
                <label>画质:</label>
                <div class="range-wrap">
                    <span class="range-min">4</span>
                    <input type="range" id="quality" min="4" max="63" value="10" class="action">
                    <span class="range-max">63</span>
                    <span class="range-val" id="quality-val">10</span>
                </div>
            </div>

            <div class="control-group">
                <label>亮度:</label>
                <div class="range-wrap">
                    <span class="range-min">-2</span>
                    <input type="range" id="brightness" min="-2" max="2" value="0" class="action">
                    <span class="range-max">2</span>
                    <span class="range-val" id="brightness-val">0</span>
                </div>
            </div>

            <div class="control-group">
                <label>对比度:</label>
                <div class="range-wrap">
                    <span class="range-min">-2</span>
                    <input type="range" id="contrast" min="-2" max="2" value="0" class="action">
                    <span class="range-max">2</span>
                    <span class="range-val" id="contrast-val">0</span>
                </div>
            </div>

            <div class="control-group">
                <label>饱和度:</label>
                <div class="range-wrap">
                    <span class="range-min">-2</span>
                    <input type="range" id="saturation" min="-2" max="2" value="0" class="action">
                    <span class="range-max">2</span>
                    <span class="range-val" id="saturation-val">0</span>
                </div>
            </div>

            <div class="control-group">
                <button id="get-still">📸 拍照</button>
                <button id="toggle-stream">▶️ 开始视频</button>
                <a id="save-still" href="#" class="button save-btn hidden" download="capture.jpg">💾 保存图片</a>
            </div>
        </div>

        <!-- 显示区域 -->
        <div class="view-area" id="view-container">
            <div class="empty-state" id="empty-state">点击"拍照"或"开始视频"查看画面</div>
            <img id="stream" class="hidden" crossorigin="anonymous">
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseHost = document.location.origin;
            const streamUrl = baseHost + ':81';

            // DOM 元素
            const view = document.getElementById('stream');
            const viewContainer = document.getElementById('view-container');
            const emptyState = document.getElementById('empty-state');
            const stillButton = document.getElementById('get-still');
            const streamButton = document.getElementById('toggle-stream');
            const saveButton = document.getElementById('save-still');

            // 显示/隐藏辅助函数
            const show = (el) => el.classList.remove('hidden');
            const hide = (el) => el.classList.add('hidden');

            // 更新配置到设备
            function updateConfig(el) {
                let value;
                switch (el.type) {
                    case 'checkbox':
                        value = el.checked ? 1 : 0;
                        break;
                    case 'range':
                    case 'select-one':
                        value = el.value;
                        break;
                    default:
                        return;
                }

                fetch(`${baseHost}/control?var=${el.id}&val=${value}`)
                    .then(response => {
                        console.log(`控制指令: ${el.id}=${value}, 状态: ${response.status}`);
                    })
                    .catch(err => console.error('控制失败:', err));
            }

            // 停止视频流
            const stopStream = () => {
                window.stop();
                streamButton.innerHTML = '▶️ 开始视频';
                streamButton.classList.remove('active');
            };

            // 开始视频流
            const startStream = () => {
                view.src = `${streamUrl}/stream`;
                show(view);
                hide(emptyState);
                show(saveButton);
                streamButton.innerHTML = '⏹️ 停止视频';
                streamButton.classList.add('active');
            };

            // 拍照
            stillButton.onclick = () => {
                stopStream();
                view.src = `${baseHost}/capture?_cb=${Date.now()}`;
                show(view);
                hide(emptyState);
                show(saveButton);
            };

            // 切换视频流
            streamButton.onclick = () => {
                const isStreaming = streamButton.innerHTML.includes('停止');
                if (isStreaming) {
                    stopStream();
                } else {
                    startStream();
                }
            };

            // 保存图片（通过 Canvas 转换跨域图片）
            saveButton.onclick = (e) => {
                e.preventDefault();
                if (!view.src) return;

                const canvas = document.createElement('canvas');
                canvas.width = view.naturalWidth || view.width;
                canvas.height = view.naturalHeight || view.height;
                const ctx = canvas.getContext('2d');
                
                try {
                    ctx.drawImage(view, 0, 0);
                    const dataURL = canvas.toDataURL('image/jpeg', 0.95);
                    
                    // 生成时间戳文件名
                    const d = new Date();
                    const filename = 
                        d.getFullYear() +
                        String(d.getMonth() + 1).padStart(2, '0') +
                        String(d.getDate()).padStart(2, '0') + '_' +
                        String(d.getHours()).padStart(2, '0') +
                        String(d.getMinutes()).padStart(2, '0') +
                        String(d.getSeconds()).padStart(2, '0') + '.jpg';
                    
                    // 触发下载
                    const link = document.createElement('a');
                    link.href = dataURL;
                    link.download = filename;
                    link.click();
                } catch (err) {
                    console.error('保存失败:', err);
                    alert('保存失败，请确保画面已加载完成');
                }
            };

            // 绑定所有控制元素
            document.querySelectorAll('.action').forEach(el => {
                // 实时更新数值显示
                const valDisplay = document.getElementById(el.id + '-val');
                if (valDisplay) {
                    el.addEventListener('input', () => {
                        valDisplay.textContent = el.value;
                    });
                }
                
                // 变化时发送到设备
                el.onchange = () => updateConfig(el);
            });

            // 加载初始状态
            fetch(`${baseHost}/status`)
                .then(res => res.json())
                .then(state => {
                    document.querySelectorAll('.action').forEach(el => {
                        if (state[el.id] !== undefined) {
                            el.value = state[el.id];
                            const valDisplay = document.getElementById(el.id + '-val');
                            if (valDisplay) valDisplay.textContent = el.value;
                        }
                    });
                })
                .catch(err => console.log('获取初始状态失败:', err));
        });
    </script>
</body>
</html>
